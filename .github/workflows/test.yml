name: Cross-platform validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      GEMINI_API_KEY: ''
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install native CBC on macOS
        if: runner.os == 'macOS'
        run: brew install cbc
      - run: python -m pip install -r requirements.txt pytest httpx
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t gridwise-test .
      - name: Validate container health
        shell: bash
        run: |
          docker run -d --name gridwise-test -p 127.0.0.1:8000:8000 gridwise-test
          trap 'docker logs gridwise-test; docker rm -f gridwise-test' EXIT
          for attempt in {1..30}; do
            if curl --fail http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          exit 1
